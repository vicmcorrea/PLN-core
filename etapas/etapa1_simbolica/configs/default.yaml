# Hydra root config for Etapa 1 symbolic evaluation.
#
# Usage:
#   uv run python etapas/etapa1_simbolica/pipelines/run_symbolic_evaluation.py
#   uv run python etapas/etapa1_simbolica/pipelines/run_symbolic_evaluation.py dataset=kaggle_tweets analyzer=oplexicon_regex
defaults:
  - dataset: kaggle_tweets
  - analyzer: oplexicon_regex
  - _self_

output_dir: outputs/etapa1_symbolic
run_id: ${now:%Y%m%d_%H%M%S_%f}
save_predictions: false
seed: 42

hydra:
  run:
    dir: ${output_dir}/runs/${run_id}/${dataset.name}/${analyzer.name}
  sweep:
    dir: ${output_dir}/multirun/${run_id}
    subdir: ${analyzer.name}
  job:
    chdir: false
