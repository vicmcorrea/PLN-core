# Hydra root config planejada para os experimentos da etapa 2.
defaults:
  - dataset: kaggle_portuguese_tweets
  - model: tfidf_logreg
  - _self_

output_dir: outputs/etapa2_subsymbolic
run_id: ${now:%Y%m%d_%H%M%S_%f}
seed: 42

metrics:
  - accuracy
  - macro_f1
  - per_class_f1
  - confusion_matrix

hydra:
  run:
    dir: ${output_dir}/runs/${run_id}/${model.name}
  sweep:
    dir: ${output_dir}/multirun/${run_id}
    subdir: ${model.name}
  job:
    chdir: false
