[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pln-core"
version = "0.1.0"
description = "Brazilian Portuguese sentiment analysis with symbolic and subsymbolic experiments"
requires-python = ">=3.10"
dependencies = [
    "datasets>=2.14",
    "hydra-core>=1.3.2",
    "pt-core-news-sm @ https://github.com/explosion/spacy-models/releases/download/pt_core_news_sm-3.8.0/pt_core_news_sm-3.8.0-py3-none-any.whl",
    "scikit-learn>=1.3",
    "spacy",
    "streamlit>=1.50.0",
]

[dependency-groups]
dev = [
    "pytest",
    "ruff",
]

[tool.setuptools.package-dir]
"" = "src"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
pln_core = ["data/*.json", "data/*.tsv"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
"tests/*.py" = ["E402"]
"streamlit_app.py" = ["E402"]
